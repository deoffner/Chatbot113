<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A hint-first precalculus tutor for college students.">
  <title>Precalculus Tutor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <main class="chat-panel">
      <header class="topbar">
        <div class="top-title">Precalculus Tutor</div>
        <button class="text-button" id="clearChat" type="button">Clear conversation</button>
      </header>

      <section class="conversation" id="conversation" aria-live="polite">
        <div class="welcome-block">
          <h1>Let’s work it<br><em>out together.</em></h1>
        </div>

        <div class="message-row tutor-row initial-message">
          <div class="avatar tutor-avatar">∑</div>
          <div class="message-content">
            <div class="message-bubble tutor-bubble">Hi! What are you working on?</div>
            <div class="guided-actions">
              <button class="chip-button" data-prompt="How do I solve 2x² + 3x - 2 = 0?" type="button">Solve an equation</button>
              <button class="chip-button" data-prompt="Can you explain what a limit means?" type="button">Explain a concept</button>
            </div>
          </div>
        </div>
      </section>

      <footer class="composer-area">
        <form class="composer" id="chatForm">
          <label class="sr-only" for="messageInput">Ask a math question</label>
          <textarea id="messageInput" rows="1" placeholder="Ask a question or paste a problem..." autocomplete="off"></textarea>
          <button class="send-button" aria-label="Send question" type="submit">↗</button>
        </form>
      </footer>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
